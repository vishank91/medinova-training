<div class="list-group">
    <a routerLink="/admin" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-house"></i>
        <span class="float-end">Home</span>
    </a>
    <a routerLink="/admin/service" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-view-list"></i>
        <span class="float-end">Service</span>
    </a>
    <a routerLink="/admin/package" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-box-seam"></i>
        <span class="float-end">Package</span>
    </a>
    <a routerLink="/admin/doctor" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-person-add"></i>
        <span class="float-end">Doctor</span>
    </a>
    <a routerLink="/admin/appointment" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-list-check"></i>
        <span class="float-end">Appointment</span>
    </a>
    <a routerLink="/admin/contactus" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-telephone"></i>
        <span class="float-end">ContactUs</span>
    </a>
    <a routerLink="/admin/newsletter" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-envelope"></i>
        <span class="float-end">Newsletter</span>
    </a>
    @if (role==="Super Admin") {
        <a routerLink="/admin/user" class="list-group-item list-group-item-action">
        <i class="fs-4 bi bi-people"></i>
        <span class="float-end">User</span>
    </a>
    }
</div>
