<app-navbar></app-navbar>

<div class="container">
    <div class="row">
        <div class="col-xl-8 col-lg-9 col-md-10 col-sm-11 m-auto">
            <h5 class="p-2 text-center border border-1">Login To Your Account</h5>
            <form [formGroup]="myForm" (submit)="postData()">
                <div class="mb-3">
                    <label>Username*</label>
                    <input type="text" name="username" formControlName="username" class="form-control"
                        placeholder="Username or Email Address">

                    @if (message) {
                        <p class="text-danger">{{message}}</p>
                    }
                </div>

                <div class="mb-3">
                    <label>Password*</label>
                    <input type="password" name="password" formControlName="password" class="form-control"
                        placeholder="Password">
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-primary w-100" [disabled]="myForm.invalid">Login</button>
                </div>
            </form>
        </div>
    </div>
</div>

<app-footer></app-footer>
